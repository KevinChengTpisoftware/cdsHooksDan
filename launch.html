<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SMART App Launch</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#e8eef5}
.box{text-align:center;background:#fff;padding:48px 64px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.box h2{color:#1565c0;margin:0 0 8px}
.box p{color:#6c757d;margin:0}
.spin{border:3px solid #dee2e6;border-top:3px solid #1565c0;border-radius:50%;width:48px;height:48px;animation:s 1s linear infinite;margin:0 auto 24px}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:20px;border-radius:8px;max-width:500px;margin-top:20px;text-align:left}
</style>
</head>
<body>
<div class="box">
<div class="spin"></div>
<h2>SMART on FHIR Launch</h2>
<p>Authorizing...</p>
<div id="e"></div>
</div>
<script>
FHIR.oauth2.authorize({
clientId:"cc344727-6f90-496c-94fd-c7829aa9a51d",
clientSecret:"79f04b56b33491716c0880af72cdef7d3f0629111421cedd18353651cd313d9e",
scope:"launch openid profile fhirUser patient/*.read",
redirectUri:"app.html"
}).catch(function(err){
document.getElementById("e").innerHTML='<div class="err"><h3>Failed</h3><p>'+err.message+'</p></div>';
document.querySelector(".spin").style.display="none";
});
</script>
</body>
</html>
