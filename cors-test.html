<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORS Test — digiRunner</title>
  <style>
    :root { --bg: #f8f9fa; --surface: #fff; --text: #1a1a2e; --muted: #6c757d; --border: #dee2e6; --ok: #2e7d32; --fail: #c62828; --blue: #0d6efd; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: .5rem; }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: .9rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .card h3 { font-size: .95rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .5rem; }
    .badge { display: inline-block; font-size: .7rem; padding: .15rem .5rem; border-radius: 10px; font-weight: 600; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-ok { background: #d4edda; color: var(--ok); }
    .badge-fail { background: #f8d7da; color: var(--fail); }
    .url { font-family: monospace; font-size: .8rem; color: var(--muted); word-break: break-all; }
    .result { margin-top: .75rem; padding: .75rem; background: #f1f3f5; border-radius: 6px; font-family: monospace; font-size: .8rem; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    button { background: var(--blue); color: #fff; border: none; padding: .6rem 1.5rem; border-radius: 6px; font-size: .95rem; cursor: pointer; margin-bottom: 1.5rem; }
    button:hover { opacity: .9; }
    .origin-info { background: #e7f1ff; padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: .85rem; }
  </style>
</head>
<body>

<h1>CORS Test: GitHub Pages vs digiRunner</h1>
<p class="subtitle">From this page's origin, fetch digiRunner endpoints and see if CORS allows it.</p>

<div class="origin-info">
  Current origin: <strong id="currentOrigin"></strong><br>
  Target: <strong>https://dgcare-dev.eapdd.tpisoftware.com</strong>
</div>

<button onclick="runAllTests()">Run All Tests</button>

<div id="tests"></div>

<script>
  document.getElementById('currentOrigin').textContent = location.origin;

  var DGR_BASE = 'https://dgcare-dev.eapdd.tpisoftware.com';

  var endpoints = [
    { name: 'SMART JWKS', method: 'GET', path: '/dgrv4/ssotoken/smart/jwks' },
    { name: 'SMART Launch', method: 'GET', path: '/dgrv4/ssotoken/smart/launch' },
    { name: 'AC Login Page', method: 'GET', path: '/dgrv4/ac4/login' },
    { name: 'Version API', method: 'GET', path: '/dgrv4/version' },
  ];

  function renderTests() {
    var container = document.getElementById('tests');
    container.innerHTML = '';
    endpoints.forEach(function(ep, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.id = 'test-' + i;
      card.innerHTML =
        '<h3><span class="badge badge-pending" id="badge-' + i + '">PENDING</span> ' + ep.name + '</h3>' +
        '<div class="url">' + ep.method + ' ' + DGR_BASE + ep.path + '</div>' +
        '<div class="result" id="result-' + i + '">waiting...</div>';
      container.appendChild(card);
    });
  }

  function runAllTests() {
    renderTests();
    endpoints.forEach(function(ep, i) {
      runTest(ep, i);
    });
  }

  function runTest(ep, index) {
    var badge = document.getElementById('badge-' + index);
    var result = document.getElementById('result-' + index);
    var url = DGR_BASE + ep.path;

    badge.textContent = 'TESTING...';
    badge.className = 'badge badge-pending';
    result.textContent = 'fetching...';

    fetch(url, { method: ep.method, mode: 'cors' })
      .then(function(resp) {
        var headers = {};
        resp.headers.forEach(function(v, k) { headers[k] = v; });

        return resp.text().then(function(body) {
          badge.textContent = 'OK ' + resp.status;
          badge.className = 'badge badge-ok';
          result.textContent =
            'Status: ' + resp.status + ' ' + resp.statusText + '\n\n' +
            'Response Headers:\n' + JSON.stringify(headers, null, 2) + '\n\n' +
            'Body (first 500 chars):\n' + body.substring(0, 500);
        });
      })
      .catch(function(err) {
        badge.textContent = 'BLOCKED';
        badge.className = 'badge badge-fail';
        result.textContent =
          'CORS Error or Network Failure:\n' + err.toString() + '\n\n' +
          'This means the server did not return an\nAccess-Control-Allow-Origin header\nthat includes ' + location.origin;
      });
  }

  renderTests();
</script>

</body>
</html>
