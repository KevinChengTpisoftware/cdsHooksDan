<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DigiCare CDS</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
<style>
:root{--p:#1565c0;--pd:#0d47a1;--bg:#e8eef5;--s:#fff;--t:#1a1a2e;--m:#6c757d;--b:#dee2e6;--ok:#2e7d32;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.topbar{background:var(--p);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .logo{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.topbar h1{font-size:1.25rem;font-weight:600}
.topbar .sub{font-size:.8rem;opacity:.8}
.topbar .uarea{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.topbar .uarea img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.topbar .uarea span{font-size:.9rem;font-weight:500}
.ct{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:1.15rem;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--p);color:var(--p)}
.center{text-align:center;padding:2rem}
.center p{color:var(--m);margin-bottom:1.5rem;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:.6rem;border:none;padding:.75rem 1.5rem;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p{background:var(--p);color:#fff}
.btn-p:hover{background:var(--pd);box-shadow:0 4px 12px rgba(21,101,192,.3)}
.btn-g{background:#fff;color:var(--t);border:2px solid var(--b)}
.btn-g:hover{border-color:var(--p)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.cg label{font-size:.8rem;color:var(--m);display:block;margin-bottom:.25rem}
.cg input{width:100%;padding:.5rem .75rem;border:1px solid var(--b);border-radius:6px;font-size:.85rem;font-family:monospace}
.ph{display:flex;align-items:center;gap:1.25rem}
.av{width:72px;height:72px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:bold;flex-shrink:0}
.pn{font-size:1.4rem;font-weight:bold}
.pm{color:var(--m);font-size:.9rem;margin-top:.25rem}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-top:1rem}
.ii{background:var(--bg);padding:.75rem 1rem;border-radius:8px}
.ii .il{font-size:.7rem;color:var(--m);text-transform:uppercase;margin-bottom:.2rem}
.ii .iv{font-size:.95rem;font-weight:500}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:.5rem 1rem;border:none;background:#eee;border-radius:8px;cursor:pointer;font-size:.85rem}
.tab:hover{background:#ddd}
.tab.active{background:var(--p);color:#fff}
.tc{display:none}.tc.active{display:block}
.ml{list-style:none;padding:0}
.mi{padding:.75rem 1rem;background:var(--bg);border-radius:8px;margin-bottom:.5rem;border-left:4px solid var(--p)}
.mn{font-weight:bold;margin-bottom:.25rem}
.md{font-size:.8rem;color:var(--m)}
.nd{text-align:center;padding:2rem;color:var(--m);font-style:italic}
.ds{font-family:monospace;font-size:.8rem;background:var(--bg);padding:1rem;border-radius:8px;max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.sp{border:3px solid var(--b);border-top:3px solid var(--p);border-radius:50%;width:30px;height:30px;animation:sp 1s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:1rem;border-radius:8px}
.sb{display:inline-block;background:#e8f5e9;color:var(--ok);padding:.3rem .8rem;border-radius:16px;font-size:.8rem;font-weight:500}
.ft{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--m)}
[hidden]{display:none!important}
@media(max-width:600px){.cg{grid-template-columns:1fr}.ph{flex-direction:column;text-align:center}.ig{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">&#x2695;</div>
<div><h1>DigiCare CDS</h1><div class="sub">Clinical Decision Support System</div></div>
<div class="uarea" id="uarea" hidden>
<img id="topImg" src="" alt="" style="background:var(--pd)"><span id="topName"></span>
<button onclick="doLogout()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:.35rem .8rem;border-radius:6px;cursor:pointer;font-size:.8rem;margin-left:.5rem">Logout</button>
</div>
</div>



<div class="ct" id="stage2">
<div class="card">
<h2>EHR Launch</h2>
<div class="center">
<p>Initiate the SMART on FHIR EHR Launch flow.</p>
<div class="cg" style="max-width:500px;margin:0 auto 1.5rem;text-align:left">
<div><label>Patient ID</label><input id="cfgP" value="0d55bd98-dfdb-4357-8e7e-f863a0e60b75"></div>
<div><label>Provider ID</label><input id="cfgR" value="429bf6ab-be0d-4b37-aaa0-f95e45762095"></div>
<div><label>Client ID</label><input id="cfgC" value="cc344727-6f90-496c-94fd-c7829aa9a51d"></div>
<div><label>User Type</label><input id="cfgU" value="practitioner"></div>
</div>
<button class="btn btn-p" onclick="doLaunch()" style="margin-right:.5rem">EHR Launch</button>
<p id="lstat" style="margin-top:1rem;font-size:.85rem"></p>
</div>
</div>
</div>

<div class="ct" id="stage3" hidden>
<div class="card"><h2>Patient</h2><div id="pi"><div class="center"><div class="sp"></div></div></div></div>
<div class="card">
<div class="tabs">
<button class="tab active" data-tab="med">Medications</button>
<button class="tab" data-tab="cond">Conditions</button>
<button class="tab" data-tab="obs">Observations</button>
<button class="tab" data-tab="raw">Raw JSON</button>
</div>
<div id="med" class="tc active"><div class="center"><div class="sp"></div></div></div>
<div id="cond" class="tc"><div class="center"><div class="sp"></div></div></div>
<div id="obs" class="tc"><div class="center"><div class="sp"></div></div></div>
<div id="raw" class="tc"><div class="ds" id="rd">...</div></div>
</div>
</div>

<div class="ft">DigiCare CDS &mdash; SMART on FHIR Demo</div>

<script>
var BASE='https://dgcare-dev.eapdd.tpisoftware.com';
var ISS=BASE+'/smart-on-fhir/hapiTw';

window.onload=function(){
  
  var ps=new URLSearchParams(location.search);
  var isCallback=sessionStorage.getItem('ehr_launched')||ps.has('code')||ps.has('state');
  if(isCallback){
    sessionStorage.removeItem('ehr_launched');restoreUser();showStage(3);fetchData();
    if(!sessionStorage.getItem('uname')){try{FHIR.oauth2.ready().then(function(cl){
      var idt=(cl.state.tokenResponse||{}).id_token;
      if(idt){var b=idt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
        var raw=atob(b);var bytes=new Uint8Array(raw.length);
        for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
        var u=JSON.parse(new TextDecoder().decode(bytes));
        saveUser(u.name||u.sub,u.email||'',u.picture||'');}
    }).catch(function(){});}catch(e){}}
    return;
  }
  if(sessionStorage.getItem('uname')){restoreUser();showStage(2);}
};


function saveUser(n,e,pic){
  sessionStorage.setItem('uname',n);sessionStorage.setItem('uemail',e);sessionStorage.setItem('upic',pic);
  document.getElementById('uarea').hidden=false;
  document.getElementById('topImg').src=pic||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(n);document.getElementById('topName').textContent=n;
}
function restoreUser(){
  var n=sessionStorage.getItem('uname'),pic=sessionStorage.getItem('upic');
  if(n){document.getElementById('uarea').hidden=false;document.getElementById('topImg').src=pic||'https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(n);document.getElementById('topName').textContent=n;}
}
function showStage(s){
  document.getElementById('stage2').hidden=(s!==2);
  document.getElementById('stage3').hidden=(s!==3);
}

function doLaunch(){
  var btn=document.querySelector('#stage2 .btn-p'),st=document.getElementById('lstat');
  btn.disabled=true;st.textContent='Requesting launch code...';
  sessionStorage.setItem('cfgP',document.getElementById('cfgP').value);
  sessionStorage.setItem('cfgC',document.getElementById('cfgC').value);
  var body='client_id='+encodeURIComponent(document.getElementById('cfgC').value)
    +'&patient='+encodeURIComponent(document.getElementById('cfgP').value)
    +'&provider='+encodeURIComponent(document.getElementById('cfgR').value)
    +'&user_type='+encodeURIComponent(document.getElementById('cfgU').value);
  fetch(BASE+'/dgrv4/ssotoken/smart/launch',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
  .then(function(r){return r.json()}).then(function(d){
    if(!d.launch)throw new Error('No launch code: '+JSON.stringify(d));
    st.textContent='Launch: '+d.launch;
    sessionStorage.setItem('ehr_launched','1');
    location.href='launch.html?iss='+encodeURIComponent(ISS)+'&launch='+encodeURIComponent(d.launch);
  }).catch(function(e){st.innerHTML='<span style="color:#c62828">'+e.message+'</span>';btn.disabled=false;});
}
function doLogout(){sessionStorage.clear();document.getElementById('uarea').hidden=true;showStage(2);history.replaceState(null,'',location.pathname);}

function fetchData(){
  var cid=sessionStorage.getItem('cfgC')||'cc344727-6f90-496c-94fd-c7829aa9a51d';
  var pid=sessionStorage.getItem('cfgP')||'0d55bd98-dfdb-4357-8e7e-f863a0e60b75';
  fetch(BASE+'/dgrv4/ssotoken/smart/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded','Authorization':'Basic '+btoa(cid+':'+btoa('79f04b56b33491716c0880af72cdef7d3f0629111421cedd18353651cd313d9e'))},
    body:'grant_type=client_credentials'
  }).then(function(r){return r.json()}).then(function(tok){
    if(!tok.access_token)throw new Error('No token: '+JSON.stringify(tok));
    var hdr={Authorization:'Bearer '+tok.access_token};
    fetch(ISS+'/Patient/'+pid,{headers:hdr}).then(function(r){return r.json()}).then(rp).catch(function(e){document.getElementById('pi').innerHTML='<div class="err">'+e.message+'</div>';});
    fetch(ISS+'/MedicationRequest?patient='+pid,{headers:hdr}).then(function(r){return r.json()}).then(function(d){
      rl('med',d.entry,function(r){return(r.medicationCodeableConcept&&(r.medicationCodeableConcept.text||(r.medicationCodeableConcept.coding&&r.medicationCodeableConcept.coding[0].display)))||'Unknown'},
      function(r){return'Status: '+(r.status||'N/A')+' | '+fd(r.authoredOn)});
    }).catch(function(e){document.getElementById('med').innerHTML='<div class="err">'+e.message+'</div>';});
    fetch(ISS+'/Condition?patient='+pid,{headers:hdr}).then(function(r){return r.json()}).then(function(d){
      rl('cond',d.entry,function(r){return(r.code&&(r.code.text||(r.code.coding&&r.code.coding[0]&&r.code.coding[0].display)))||'Unknown'},
      function(r){var st=r.clinicalStatus&&r.clinicalStatus.coding&&r.clinicalStatus.coding[0]?r.clinicalStatus.coding[0].code:'N/A';return'Status: '+st+' | '+fd(r.onsetDateTime)});
    }).catch(function(e){document.getElementById('cond').innerHTML='<div class="err">'+e.message+'</div>';});
    fetch(ISS+'/Observation?patient='+pid+'&_count=20',{headers:hdr}).then(function(r){return r.json()}).then(function(d){
      rl('obs',d.entry,function(r){return(r.code&&(r.code.text||(r.code.coding&&r.code.coding[0]&&r.code.coding[0].display)))||'Unknown'},
      function(r){var v='N/A';if(r.valueQuantity)v=r.valueQuantity.value+' '+(r.valueQuantity.unit||'');else if(r.valueString)v=r.valueString;return'Value: '+v+' | '+fd(r.effectiveDateTime)});
    }).catch(function(e){document.getElementById('obs').innerHTML='<div class="err">'+e.message+'</div>';});
  }).catch(function(e){document.getElementById('pi').innerHTML='<div class="err">Token error: '+e.message+'</div>';});
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');document.getElementById(this.dataset.tab).classList.add('active');
  });
});

function fd(d){if(!d)return'N/A';try{return new Date(d).toLocaleDateString('zh-TW')}catch(e){return d}}
function age(b){if(!b)return'N/A';return(new Date().getFullYear()-new Date(b).getFullYear())+' y/o'}
function gn(p){if(!p.name||!p.name.length)return'Unknown';var n=p.name[0];if(n.text)return n.text;var r=[];if(n.family)r.push(n.family);if(n.given)r=r.concat(n.given);return r.join(' ')||'Unknown'}
function rp(p){
  var n=gn(p);
  document.getElementById('pi').innerHTML=
    '<div class="ph"><img class="av" src="https://api.dicebear.com/9.x/initials/svg?seed='+encodeURIComponent(n)+'&backgroundColor=1565c0" style="object-fit:cover"><div><div class="pn">'+n+'</div><div class="pm">ID: '+(p.id||'N/A')+'</div></div></div>'+
    '<div class="ig">'+
    '<div class="ii"><div class="il">Birthday</div><div class="iv">'+fd(p.birthDate)+'</div></div>'+
    '<div class="ii"><div class="il">Age</div><div class="iv">'+age(p.birthDate)+'</div></div>'+
    '<div class="ii"><div class="il">Gender</div><div class="iv">'+(p.gender||'N/A')+'</div></div></div>';
  document.getElementById('rd').textContent=JSON.stringify(p,null,2);
}
function rl(cid,entries,nf,df){
  var c=document.getElementById(cid);
  if(!entries||!entries.length){c.innerHTML='<div class="nd">No records</div>';return;}
  var h='<ul class="ml">';
  entries.forEach(function(e){h+='<li class="mi"><div class="mn">'+nf(e.resource)+'</div><div class="md">'+df(e.resource)+'</div></li>';});
  c.innerHTML=h+'</ul>';
}
</script>
</body>
</html>
