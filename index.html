<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiCare Hospital</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-page">
  <div class="login-header">DigiCare Hospital &mdash; Clinical Decision Support System</div>
  <div class="login-center">
    <div class="login-card">
      <div class="hospital-icon">&#x2695;</div>
      <h1>DigiCare Hospital</h1>
      <p class="subtitle">Clinical Decision Support System</p>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Sign In
      </button>
      <div class="login-status" id="loginStatus"></div>
    </div>
  </div>
  <div class="login-footer">Powered by SMART on FHIR &amp; CDS Hooks</div>
</div>

<script src="config.js"></script>
<script>
function doLogin() {
  var btn = document.getElementById('loginBtn');
  var status = document.getElementById('loginStatus');
  btn.disabled = true;
  status.textContent = 'Connecting...';

  var secret = CFG.CLIENT_SECRET;
  var basicInner = btoa(secret);
  var basicAuth = btoa(CFG.CLIENT_ID + ':' + basicInner);

  var body = 'client_id=' + encodeURIComponent(CFG.CLIENT_ID)
    + '&patient=' + encodeURIComponent(CFG.DEFAULT_PATIENT)
    + '&provider=' + encodeURIComponent(CFG.DEFAULT_PROVIDER)
    + '&user_type=practitioner';

  fetch(CFG.BASE + '/dgrv4/ssotoken/smart/launch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!d.launch) throw new Error('Launch failed');
    status.textContent = 'Redirecting...';
    sessionStorage.setItem('ehr_launched', '1');
    sessionStorage.setItem('cfgP', CFG.DEFAULT_PATIENT);
    sessionStorage.setItem('cfgC', CFG.CLIENT_ID);
    var iss = CFG.BASE + '/smart-on-fhir/digiCare/fhir';
    window.location.href = 'launch.html?iss=' + encodeURIComponent(iss) + '&launch=' + encodeURIComponent(d.launch);
  })
  .catch(function(e) {
    status.textContent = e.message;
    status.style.color = '#c62828';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
